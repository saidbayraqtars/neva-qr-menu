# Neva-QR Menü — nginx sunucu bloğu (Ubuntu 24.04)
#
# TEK BLOK, WILDCARD: kiracı başına dosya YOKTUR. `server_name` içindeki
# joker sayesinde lumina.nevaqr.com, galya.nevaqr.com... hepsi buraya düşer;
# hangi kiracı olduğunu Laravel `ResolveTenant` middleware'i çözer.
#
# Kurulum:
#   sudo cp deploy/nginx/nevaqr.conf /etc/nginx/sites-available/nevaqr.conf
#   sudo ln -s /etc/nginx/sites-available/nevaqr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOT: HTTP/2 `listen ... http2` biçiminde açılıyor. Ayrı `http2 on;` direktifi
# nginx 1.25.1+ ister; Ubuntu 24.04 nginx 1.24 ile geliyor ve onu tanımıyor.
#
# İleride ikinci bir uygulama eklerken bu dosyayı ŞABLON olarak kopyalayın;
# panel kurmaya gerek yok, her site kendi conf dosyasında yaşar.

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nevaqr.com *.nevaqr.com;

    # Let's Encrypt HTTP-01 doğrulaması (Cloudflare Origin CA kullanıyorsanız
    # gerekmez ama zararı yok — yedek yol açık kalsın).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www → çıplak alan adı (SEO: tek kanonik host)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.nevaqr.com;

    ssl_certificate     /etc/ssl/nevaqr/origin.pem;
    ssl_certificate_key /etc/ssl/nevaqr/origin.key;

    return 301 https://nevaqr.com$request_uri;
}

# ---------------------------------------------------------------------------
# Uygulama — ana domain + tüm kiracı alt domainleri
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevaqr.com *.nevaqr.com;

    root /var/www/nevaqr/public;
    index index.php;

    charset utf-8;

    # --- TLS ---------------------------------------------------------------
    # Cloudflare proxy (turuncu bulut) kullanıyorsanız buraya Cloudflare
    # Origin CA sertifikası konur: 15 yıl geçerli, yenileme derdi yok.
    # Cloudflare'siz gidilecekse certbot ile WILDCARD sertifika şart
    # (`*.nevaqr.com` yalnızca DNS-01 ile verilir) — bkz. docs/URETIM.md §1.2.
    ssl_certificate     /etc/ssl/nevaqr/origin.pem;
    ssl_certificate_key /etc/ssl/nevaqr/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Yükleme boyutu ----------------------------------------------------
    # Ürün görseli 6 MB'a kadar; PHP tarafındaki upload_max_filesize ile
    # birlikte değiştirin, yalnız biri artırılırsa yükleme sessizce başarısız olur.
    client_max_body_size 12M;

    # --- Sıkıştırma --------------------------------------------------------
    # KRİTİK: 140 kalemlik bir menünün HTML'i ~125 KB. Sıkıştırma açıkken
    # ~18 KB'a iniyor. Mobil bağlantıda ilk açılış farkı buradan geliyor.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml application/manifest+json;

    # --- Statik varlıklar --------------------------------------------------
    # Vite çıktısı içerik karmalı adlar üretir (app-BFPCNVBN.css); içerik
    # değişince ad da değişir, bu yüzden sonsuza dek önbelleklenebilir.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # --- Uygulama ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm-nevaqr.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # PDF üretimi headless Chrome başlatıyor; 60 sn'yi geçebiliyor.
        fastcgi_read_timeout 90s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # public/ altındaki index.php DIŞINDA hiçbir .php çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    # Nokta ile başlayan her şey (.env, .git, .htaccess) kapalı.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/nevaqr-access.log;
    error_log  /var/log/nginx/nevaqr-error.log;
}
